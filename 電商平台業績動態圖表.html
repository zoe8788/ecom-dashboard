<script>

const DATA = window.__ECOM_DATA__;
const months = DATA.months;
const platforms = DATA.platforms;
const dates = DATA.dates;
const monthLabels = months.map(m => { const [y, mo] = m.split('-'); return `${y}/${mo}`; });

const COLORS = ['#2563eb','#dc2626','#059669','#d97706','#7c3aed','#db2777','#0891b2','#65a30d','#ea580c','#4f46e5','#0d9488'];
const platColor = {};
platforms.forEach((p,i)=>platColor[p]=COLORS[i%COLORS.length]);

function fmt(n){ if(n===null||n===undefined) return '—'; return Math.round(n).toLocaleString('zh-TW'); }

const chartTypeSel = document.getElementById('chartType');
const monthSel = document.getElementById('monthSelect');
const platformSel = document.getElementById('platformSelect');
const trafficPlatformSel = document.getElementById('trafficPlatformSelect');
const categorySel = document.getElementById('categorySelect');
const ipPlatformSel = document.getElementById('ipPlatformSelect');
const ipSel = document.getElementById('ipSelect');
const monthWrap = document.getElementById('monthWrap');
const platformWrap = document.getElementById('platformWrap');
const trafficPlatformWrap = document.getElementById('trafficPlatformWrap');
const categoryWrap = document.getElementById('categoryWrap');
const ipPlatformWrap = document.getElementById('ipPlatformWrap');
const ipWrap = document.getElementById('ipWrap');
const titleEl = document.getElementById('chartTitle');
const statsEl = document.getElementById('statsRow');
const chartArea = document.getElementById('chartArea');
const tooltip = document.getElementById('tooltip');

months.forEach((m,i)=>{
  const opt=document.createElement('option'); opt.value=i; opt.textContent=monthLabels[i];
  monthSel.appendChild(opt);
});
const allMonthsOpt=document.createElement('option'); allMonthsOpt.value='all'; allMonthsOpt.textContent='全部月份加總';
monthSel.insertBefore(allMonthsOpt, monthSel.firstChild);
monthSel.value='all';

const allPlatOpt=document.createElement('option'); allPlatOpt.value='all'; allPlatOpt.textContent='全部平台加總';
platformSel.appendChild(allPlatOpt);
platforms.forEach(p=>{ const opt=document.createElement('option'); opt.value=p; opt.textContent=p; platformSel.appendChild(opt); });
platformSel.value='all';

const allTrafficPlatOpt=document.createElement('option'); allTrafficPlatOpt.value='all'; allTrafficPlatOpt.textContent='流量平台加總';
trafficPlatformSel.appendChild(allTrafficPlatOpt);
(DATA.trafficPlatforms||[]).forEach(p=>{ const opt=document.createElement('option'); opt.value=p; opt.textContent=p; trafficPlatformSel.appendChild(opt); });
trafficPlatformSel.value='all';

if(DATA.categories){
  DATA.categories.forEach(c=>{ const opt=document.createElement('option'); opt.value=c; opt.textContent=c; categorySel.appendChild(opt); });
  categorySel.value = DATA.categories[0];
}

const CATEGORY_COLORS = {
  '日用包袋': '#2563eb', '居家生活雜貨': '#059669', '服飾配件': '#0891b2',
  '玩具.玩偶.桌遊': '#d97706', '餐廚用品': '#db2777', '文具禮品': '#65a30d',
  '美妝雜貨': '#a78bfa', '遊玩/機台': '#f97316', '3C配件': '#0d9488',
  '其他': '#9ca3af', '未分類': '#6b7280',
};

const allIpPlatOpt=document.createElement('option'); allIpPlatOpt.value='all'; allIpPlatOpt.textContent='8平台加總';
ipPlatformSel.appendChild(allIpPlatOpt);
(DATA.ipPlatforms||[]).forEach(p=>{ const opt=document.createElement('option'); opt.value=p; opt.textContent=p; ipPlatformSel.appendChild(opt); });
ipPlatformSel.value='all';

if(DATA.ipCategories){
  DATA.ipCategories.forEach(c=>{ const opt=document.createElement('option'); opt.value=c; opt.textContent=c; ipSel.appendChild(opt); });
  ipSel.value = DATA.ipCategories[0];
}

const IP_COLORS = {
  '米飛兔': '#2563eb', '嚕嚕米': '#059669', '櫻桃小丸子': '#dc2626',
  '早午餐兄弟': '#d97706', '吉伊卡哇': '#db2777', '史努比': '#7c3aed',
  '三麗鷗': '#ec4899', '鬼滅之刃': '#0891b2', 'Poli': '#65a30d',
  '待確認': '#f59e0b', '無IP': '#9ca3af', '其他': '#9ca3af', '未分類': '#6b7280',
};

const METRIC_CONFIG = {
  monthlyRevenue:    { unit: '元', agg: 'sum', platforms: platforms },
  monthlyOrders:     { unit: '筆', agg: 'sum', platforms: platforms },
  monthlyAOV:        { unit: '元', agg: 'avg', platforms: platforms },
  monthlyConversion: { unit: '%',  agg: 'avg', platforms: DATA.trafficPlatforms || [] },
};

function getRanking(metric, monthIdxOrAll){
  const src = DATA[metric] || {};
  const cfg = METRIC_CONFIG[metric];
  const rows = cfg.platforms.map(p=>{
    const arr = (src[p]||[]).map(v => v);
    let val;
    if(monthIdxOrAll==='all'){
      const valid = arr.filter(v=>v!==null && v!==undefined);
      if(valid.length===0){ val = 0; }
      else if(cfg.agg==='avg'){ val = valid.reduce((a,b)=>a+b,0)/valid.length; }
      else { val = valid.reduce((a,b)=>a+b,0); }
    } else {
      const v = arr[monthIdxOrAll];
      val = (v===null || v===undefined) ? 0 : v;
    }
    return {platform:p, value:val};
  });
  rows.sort((a,b)=>b.value-a.value);
  return rows;
}

function renderRanking(metric, label){
  const cfg = METRIC_CONFIG[metric];
  const monthVal = monthSel.value==='all' ? 'all' : parseInt(monthSel.value,10);
  const rows = getRanking(metric, monthVal);
  const periodLabel = monthVal==='all' ? (cfg.agg==='avg' ? '全部月份平均' : '全部月份加總') : monthLabels[monthVal];
  titleEl.textContent = `${label}排名 — ${periodLabel}`;

  const maxVal = Math.max(...rows.map(r=>r.value), 1);
  const unit = cfg.unit;

  let html = '<div class="bar-chart">';
  rows.forEach(r=>{
    const pct = (r.value/maxVal*100).toFixed(2);
    html += `
      <div class="bar-row" data-value="${fmt(r.value)} ${unit}" data-plat="${r.platform}">
        <div class="bar-label">${r.platform}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%;background:${platColor[r.platform]}"></div>
        </div>
        <div class="bar-value">${fmt(r.value)}</div>
      </div>`;
  });
  html += '</div>';
  chartArea.innerHTML = html;
  chartArea.style.display = '';
  document.getElementById('tableArea').style.display = 'none';

  requestAnimationFrame(()=>{
    chartArea.querySelectorAll('.bar-fill').forEach(el=>{
      el.style.transition = 'width 0.6s cubic-bezier(.2,.8,.2,1)';
    });
  });

  chartArea.querySelectorAll('.bar-row').forEach(row=>{
    row.addEventListener('mouseenter', ()=>{
      tooltip.textContent = `${row.dataset.plat}: ${row.dataset.value}`;
      tooltip.style.opacity = 1;
    });
    row.addEventListener('mousemove', (e)=>{
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 10) + 'px';
    });
    row.addEventListener('mouseleave', ()=>{ tooltip.style.opacity = 0; });
  });

  const total = cfg.agg === 'avg'
    ? rows.reduce((a,r)=>a+r.value,0) / (rows.length||1)
    : rows.reduce((a,r)=>a+r.value,0);
  const top = rows[0];
  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-label">${cfg.agg==='avg' ? '平均' : '總計'}</div><div class="stat-value">${fmt(total)} ${unit}</div></div>
    <div class="stat-card"><div class="stat-label">冠軍平台</div><div class="stat-value">${top ? top.platform : '—'}</div></div>
    <div class="stat-card"><div class="stat-label">平台數</div><div class="stat-value">${rows.length}</div></div>
  `;
}

function renderDaily(){
  const platVal = platformSel.value;
  const monthVal = monthSel.value==='all' ? 'all' : parseInt(monthSel.value,10);
  const datesForRange = monthVal==='all' ? dates : dates.filter(d=>d.startsWith(months[monthVal]));
  const periodLabel = monthVal==='all' ? `${monthLabels[0]} - ${monthLabels[monthLabels.length-1]}` : monthLabels[monthVal];
  titleEl.textContent = `每日銷售額 — ${platVal==='all' ? '全部平台加總' : platVal}（${periodLabel}）`;

  const values = datesForRange.map(d=>{
    const i = dates.indexOf(d);
    if(platVal==='all'){
      return platforms.reduce((sum,p)=> sum + (DATA.dailyRevenue[p][i]||0), 0);
    } else {
      return DATA.dailyRevenue[platVal][i] || 0;
    }
  });

  const W = 900, H = 380, padL = 56, padR = 16, padT = 16, padB = 30;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxV = Math.max(...values, 1);
  const n = values.length;

  const xFor = (i) => padL + (n<=1 ? 0 : (i/(n-1))*innerW);
  const yFor = (v) => padT + innerH - (v/maxV)*innerH;

  let path = '';
  values.forEach((v,i)=>{ path += (i===0?'M':'L') + xFor(i).toFixed(1) + ',' + yFor(v).toFixed(1) + ' '; });
  let areaPath = path + `L${xFor(n-1).toFixed(1)},${(padT+innerH).toFixed(1)} L${xFor(0).toFixed(1)},${(padT+innerH).toFixed(1)} Z`;

  const color = platVal==='all' ? '#2563eb' : platColor[platVal];

  let gridLines = '';
  const steps = 4;
  for(let s=0;s<=steps;s++){
    const v = maxV/steps*s;
    const y = yFor(v);
    gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#eef0f4" stroke-width="1"/>`;
    gridLines += `<text x="${padL-8}" y="${(y+4).toFixed(1)}" font-size="11" fill="#6b7280" text-anchor="end">${fmt(v)}</text>`;
  }

  let xLabels = '';
  const tickCount = Math.min(10, n-1 || 1);
  for(let t=0;t<=tickCount;t++){
    const i = Math.round(t/tickCount*(n-1));
    const d = datesForRange[i];
    const parts = d.split('-');
    xLabels += `<text x="${xFor(i).toFixed(1)}" y="${H-8}" font-size="10" fill="#6b7280" text-anchor="middle">${parts[1]}/${parts[2]}</text>`;
  }

  chartArea.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="380" id="lineSvg" style="overflow:visible;">
      ${gridLines}
      <path d="${areaPath}" fill="${color}" fill-opacity="0.1" stroke="none"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
      ${xLabels}
      <circle id="hoverDot" r="4" fill="${color}" stroke="#fff" stroke-width="2" style="opacity:0;"/>
      <rect id="hoverCapture" x="${padL}" y="${padT}" width="${innerW}" height="${innerH}" fill="transparent"/>
    </svg>
  `;
  chartArea.style.display = '';
  document.getElementById('tableArea').style.display = 'none';

  const svg = document.getElementById('lineSvg');
  const hoverDot = document.getElementById('hoverDot');
  const hoverCapture = document.getElementById('hoverCapture');

  function pointFromEvent(evt){
    const rect = svg.getBoundingClientRect();
    const scaleX = W / rect.width;
    const xPix = (evt.clientX - rect.left) * scaleX;
    let idx = Math.round(((xPix - padL) / innerW) * (n-1));
    idx = Math.max(0, Math.min(n-1, idx));
    return idx;
  }

  hoverCapture.addEventListener('mousemove', (evt)=>{
    const idx = pointFromEvent(evt);
    const v = values[idx];
    hoverDot.setAttribute('cx', xFor(idx).toFixed(1));
    hoverDot.setAttribute('cy', yFor(v).toFixed(1));
    hoverDot.style.opacity = 1;
    tooltip.textContent = `${datesForRange[idx]}：${fmt(v)} 元`;
    tooltip.style.opacity = 1;
    tooltip.style.left = (evt.clientX + 14) + 'px';
    tooltip.style.top = (evt.clientY + 10) + 'px';
  });
  hoverCapture.addEventListener('mouseleave', ()=>{
    hoverDot.style.opacity = 0;
    tooltip.style.opacity = 0;
  });

  const total = values.reduce((a,b)=>a+b,0);
  const avg = total/values.length;
  const maxIdx = values.indexOf(Math.max(...values));
  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-label">期間總銷售額</div><div class="stat-value">${fmt(total)} 元</div></div>
    <div class="stat-card"><div class="stat-label">日均銷售額</div><div class="stat-value">${fmt(avg)} 元</div></div>
    <div class="stat-card"><div class="stat-label">單日最高</div><div class="stat-value">${datesForRange[maxIdx]}（${fmt(values[maxIdx])} 元）</div></div>
  `;
}

function renderTrafficTrend(){
  const trafficPlatforms = DATA.trafficPlatforms || [];
  if(trafficPlatforms.length === 0){
    titleEl.textContent = '流量趨勢 — 尚無資料';
    chartArea.style.display = 'none';
    document.getElementById('tableArea').style.display = 'none';
    statsEl.innerHTML = `<div class="stat-card"><div class="stat-label">提醒</div><div class="stat-value" style="font-size:14px;">找不到流量後台資料</div></div>`;
    return;
  }

  const platVal = trafficPlatformSel.value;
  const platList = platVal === 'all' ? trafficPlatforms : [platVal];
  const pvValues = months.map((m,i)=> platList.reduce((s,p)=> s + ((DATA.monthlyPageviews[p]||[])[i]||0), 0));
  const visValues = months.map((m,i)=> platList.reduce((s,p)=> s + ((DATA.monthlyVisitors[p]||[])[i]||0), 0));

  titleEl.textContent = `流量趨勢 — ${platVal==='all' ? '流量平台加總' : platVal}`;

  const W=900,H=380,padL=56,padR=56,padT=16,padB=30;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const n = months.length;
  const maxPV = Math.max(...pvValues,1);
  const maxVis = Math.max(...visValues,1);
  const xFor=(i)=> padL + (n<=1?0:(i/(n-1))*innerW);
  const yForPV=(v)=> padT+innerH-(v/maxPV)*innerH;
  const yForVis=(v)=> padT+innerH-(v/maxVis)*innerH;

  let pvPath=''; pvValues.forEach((v,i)=>{ pvPath += (i===0?'M':'L')+xFor(i).toFixed(1)+','+yForPV(v).toFixed(1)+' '; });
  let visPath=''; visValues.forEach((v,i)=>{ visPath += (i===0?'M':'L')+xFor(i).toFixed(1)+','+yForVis(v).toFixed(1)+' '; });

  let gridLines='';
  const steps=4;
  for(let s=0;s<=steps;s++){
    const vPV = maxPV/steps*s;
    const y = yForPV(vPV);
    gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#eef0f4" stroke-width="1"/>`;
    gridLines += `<text x="${padL-8}" y="${(y+4).toFixed(1)}" font-size="11" fill="#2563eb" text-anchor="end">${fmt(vPV)}</text>`;
    const vVis = maxVis/steps*s;
    gridLines += `<text x="${W-padR+8}" y="${(y+4).toFixed(1)}" font-size="11" fill="#059669" text-anchor="start">${fmt(vVis)}</text>`;
  }

  let xLabels='';
  months.forEach((m,i)=>{
    xLabels += `<text x="${xFor(i).toFixed(1)}" y="${H-8}" font-size="10" fill="#6b7280" text-anchor="middle">${monthLabels[i]}</text>`;
  });

  chartArea.innerHTML = `
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:8px;font-size:12px;color:#374151;">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#2563eb;margin-right:4px;"></span>瀏覽量（左軸・次）</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#059669;margin-right:4px;"></span>訪客數（右軸・人）</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="380" id="trafficSvg" style="overflow:visible;">
      ${gridLines}
      <path d="${pvPath}" fill="none" stroke="#2563eb" stroke-width="2"/>
      <path d="${visPath}" fill="none" stroke="#059669" stroke-width="2"/>
      ${xLabels}
      <circle id="hoverDotPV" r="4" fill="#2563eb" stroke="#fff" stroke-width="2" style="opacity:0;"/>
      <circle id="hoverDotVis" r="4" fill="#059669" stroke="#fff" stroke-width="2" style="opacity:0;"/>
      <rect id="hoverCaptureTraffic" x="${padL}" y="${padT}" width="${innerW}" height="${innerH}" fill="transparent"/>
    </svg>
  `;
  chartArea.style.display = '';
  document.getElementById('tableArea').style.display = 'none';

  const hoverDotPV = document.getElementById('hoverDotPV');
  const hoverDotVis = document.getElementById('hoverDotVis');
  const hoverCapture = document.getElementById('hoverCaptureTraffic');
  const svg = document.getElementById('trafficSvg');

  hoverCapture.addEventListener('mousemove',(evt)=>{
    const rect = svg.getBoundingClientRect();
    const scaleX = W/rect.width;
    const xPix = (evt.clientX-rect.left)*scaleX;
    let idx = Math.round(((xPix-padL)/innerW)*(n-1));
    idx = Math.max(0, Math.min(n-1, idx));
    hoverDotPV.setAttribute('cx', xFor(idx).toFixed(1));
    hoverDotPV.setAttribute('cy', yForPV(pvValues[idx]).toFixed(1));
    hoverDotVis.setAttribute('cx', xFor(idx).toFixed(1));
    hoverDotVis.setAttribute('cy', yForVis(visValues[idx]).toFixed(1));
    hoverDotPV.style.opacity = 1;
    hoverDotVis.style.opacity = 1;
    tooltip.innerHTML = `${monthLabels[idx]}<br>瀏覽量: ${fmt(pvValues[idx])} 次<br>訪客數: ${fmt(visValues[idx])} 人`;
    tooltip.style.opacity = 1;
    tooltip.style.left = (evt.clientX + 14) + 'px';
    tooltip.style.top = (evt.clientY + 10) + 'px';
  });
  hoverCapture.addEventListener('mouseleave',()=>{
    hoverDotPV.style.opacity = 0;
    hoverDotVis.style.opacity = 0;
    tooltip.style.opacity = 0;
  });

  const totalPV = pvValues.reduce((a,b)=>a+b,0);
  const totalVis = visValues.reduce((a,b)=>a+b,0);
  const maxIdx = pvValues.indexOf(Math.max(...pvValues));
  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-label">總瀏覽量</div><div class="stat-value">${fmt(totalPV)} 次</div></div>
    <div class="stat-card"><div class="stat-label">總訪客數</div><div class="stat-value">${fmt(totalVis)} 人</div></div>
    <div class="stat-card"><div class="stat-label">單月瀏覽最高</div><div class="stat-value">${monthLabels[maxIdx]}（${fmt(pvValues[maxIdx])} 次）</div></div>
  `;
}

      <tbody>${rows}</tbody>
    </table>
    <div class="table-note">${qtyNote}</div>
  `;

  const totalRev = items.reduce((a,b)=>a+b.revenue,0);
  const top = items[0];
  const periodTotal = isAll ? DATA.productRevenueTotalAll : (DATA.productMonthlyRevenueTotal||{})[ym];
  const shareText = (periodTotal && periodTotal>0) ? `${(totalRev/periodTotal*100).toFixed(1)}%` : '—';
  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-label">TOP${items.length}總金額</div><div class="stat-value">${fmt(totalRev)} 元</div></div>
    <div class="stat-card"><div class="stat-label">冠軍商品</div><div class="stat-value" style="font-size:14px;">${top.name}</div></div>
    <div class="stat-card"><div class="stat-label">統計期間</div><div class="stat-value" style="font-size:14px;">${periodLabel}</div></div>
    <div class="stat-card"><div class="stat-label">TOP${items.length}佔當期營業額比例</div><div class="stat-value">${shareText}</div></div>
  `;
}

function renderSlowMoving(){
  const items = DATA.slowMoving || [];
  const thresh = DATA.slowMovingThresholdDays || 60;
  titleEl.textContent = `滯銷庫存分析 — 目前有庫存但近${thresh}天沒賣出`;
  chartArea.style.display = 'none';
  const tableArea = document.getElementById('tableArea');
  tableArea.style.display = '';

  if(!items.length){
    tableArea.innerHTML = `<div class="table-note">目前沒有符合「有庫存但近${thresh}天未售出」的商品，庫存去化狀況良好。</div>`;
    statsEl.innerHTML = '';
    return;
  }

  const rows = items.map(item=>{
    const lastSaleText = item.lastSaleDate
      ? `${item.lastSaleDate}（${item.daysSince} 天前）`
      : `<span class="tag warn-tag">ERP期間內無銷售紀錄</span>`;
    return `<tr>
      <td>${item.name}</td>
      <td>${item.category || '—'}</td>
      <td class="num">${fmt(item.stock)}</td>
      <td>${lastSaleText}</td>
    </tr>`;
  }).join('');

  tableArea.innerHTML = `
    <table class="data-table">
      <thead><tr><th>商品</th><th>分類</th><th class="num">目前庫存</th><th>最後銷售</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="table-note">符合條件共 ${DATA.slowMovingTotalCount} 項，這裡列出庫存量最高的前 ${items.length} 項。</div>
  `;

  const totalStock = items.reduce((a,b)=>a+b.stock,0);
  const neverSold = items.filter(x=>!x.lastSaleDate).length;
  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-label">滯銷候選商品數</div><div class="stat-value">${DATA.slowMovingTotalCount} 項</div></div>
    <div class="stat-card"><div class="stat-label">本表庫存量合計</div><div class="stat-value">${fmt(totalStock)} 件</div></div>
    <div class="stat-card"><div class="stat-label">從未售出</div><div class="stat-value">${neverSold} 項</div></div>
  `;
}

function renderYoyComparison(){
  if(!DATA.yoyThisYearMonthly || !DATA.yoyLastYearMonthly){
    titleEl.textContent = '去年同期比較 — 尚無資料';
    chartArea.style.display = 'none';
    document.getElementById('tableArea').style.display = 'none';
    statsEl.innerHTML = `<div class="stat-card"><div class="stat-label">提醒</div><div class="stat-value" style="font-size:14px;">找不到「年度營業額」工作表資料</div></div>`;
    return;
  }

  const thisYear = DATA.yoyThisYear, lastYear = DATA.yoyLastYear;
  const platVal = platformSel.value;
  const isAll = platVal === 'all';
  const thisYearArr = isAll ? DATA.yoyThisYearTotalMonthly : (DATA.yoyThisYearMonthly[platVal] || Array(12).fill(null));
  const lastYearArr = isAll ? DATA.yoyLastYearTotalMonthly : (DATA.yoyLastYearMonthly[platVal] || Array(12).fill(null));
  const monthLabelsFull = Array.from({length:12}, (_,i)=>`${i+1}月`);

  titleEl.textContent = `${thisYear}年 vs ${lastYear}年同期比較 — ${isAll ? '全部平台加總' : platVal}`;

  const W=900,H=380,padL=64,padR=16,padT=16,padB=30;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const n = 12;
  const allVals = thisYearArr.concat(lastYearArr).filter(v=>v!=null);
  const maxV = Math.max(...allVals, 1);
  const xFor=(i)=> padL + (i/(n-1))*innerW;
  const yFor=(v)=> padT+innerH-(v/maxV)*innerH;

  function buildPath(arr){
    let path='', started=false;
    arr.forEach((v,i)=>{
      if(v==null){ started=false; return; }
      path += (started?'L':'M')+xFor(i).toFixed(1)+','+yFor(v).toFixed(1)+' ';
      started = true;
    });
    return path;
  }
  const thisPath = buildPath(thisYearArr);
  const lastPath = buildPath(lastYearArr);

  let gridLines='';
  const steps=4;
  for(let s=0;s<=steps;s++){
    const v = maxV/steps*s;
    const y = yFor(v);
    gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#eef0f4" stroke-width="1"/>`;
    gridLines += `<text x="${padL-8}" y="${(y+4).toFixed(1)}" font-size="11" fill="#6b7280" text-anchor="end">${fmt(v)}</text>`;
  }
  let xLabels='';
  monthLabelsFull.forEach((lbl,i)=>{
    xLabels += `<text x="${xFor(i).toFixed(1)}" y="${H-8}" font-size="10" fill="#6b7280" text-anchor="middle">${lbl}</text>`;
  });

  chartArea.innerHTML = `
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:8px;font-size:12px;color:#374151;">
      <span><span style="display:inline-block;width:14px;height:2px;background:#2563eb;margin-right:4px;vertical-align:middle;"></span>${thisYear}年</span>
      <span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed #9ca3af;margin-right:4px;vertical-align:middle;"></span>${lastYear}年</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="380" id="yoySvg" style="overflow:visible;">
      ${gridLines}
      <path d="${lastPath}" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,4"/>
      <path d="${thisPath}" fill="none" stroke="#2563eb" stroke-width="2"/>
      ${xLabels}
      <circle id="hoverDotThis" r="4" fill="#2563eb" stroke="#fff" stroke-width="2" style="opacity:0;"/>
      <circle id="hoverDotLast" r="4" fill="#9ca3af" stroke="#fff" stroke-width="2" style="opacity:0;"/>
      <rect id="hoverCaptureYoy" x="${padL}" y="${padT}" width="${innerW}" height="${innerH}" fill="transparent"/>
    </svg>
  `;
  chartArea.style.display = '';
  document.getElementById('tableArea').style.display = 'none';

  const hoverDotThis = document.getElementById('hoverDotThis');
  const hoverDotLast = document.getElementById('hoverDotLast');
  const hoverCapture = document.getElementById('hoverCaptureYoy');
  const svg = document.getElementById('yoySvg');

  hoverCapture.addEventListener('mousemove',(evt)=>{
    const rect = svg.getBoundingClientRect();
    const scaleX = W/rect.width;
    const xPix = (evt.clientX-rect.left)*scaleX;
    let idx = Math.round(((xPix-padL)/innerW)*(n-1));
    idx = Math.max(0, Math.min(n-1, idx));
    const cur = thisYearArr[idx], prev = lastYearArr[idx];
    if(cur!=null){
      hoverDotThis.setAttribute('cx', xFor(idx).toFixed(1));
      hoverDotThis.setAttribute('cy', yFor(cur).toFixed(1));
      hoverDotThis.style.opacity = 1;
    } else { hoverDotThis.style.opacity = 0; }
    if(prev!=null){
      hoverDotLast.setAttribute('cx', xFor(idx).toFixed(1));
      hoverDotLast.setAttribute('cy', yFor(prev).toFixed(1));
      hoverDotLast.style.opacity = 1;
    } else { hoverDotLast.style.opacity = 0; }
    let yoyLine = '';
    if(cur!=null && prev!=null && prev!==0){
      const pct = (cur-prev)/prev*100;
      yoyLine = `<br>YoY：${pct>=0?'+':''}${pct.toFixed(1)}%`;
    }
    tooltip.innerHTML = `${monthLabelsFull[idx]}<br>${thisYear}年：${cur==null?'無資料':fmt(cur)+' 元'}<br>${lastYear}年：${prev==null?'無資料':fmt(prev)+' 元'}${yoyLine}`;
    tooltip.style.opacity = 1;
    tooltip.style.left = (evt.clientX + 14) + 'px';
    tooltip.style.top = (evt.clientY + 10) + 'px';
  });
  hoverCapture.addEventListener('mouseleave',()=>{
    hoverDotThis.style.opacity = 0;
    hoverDotLast.style.opacity = 0;
    tooltip.style.opacity = 0;
  });

  let curSum=0, prevSum=0, cnt=0;
  thisYearArr.forEach((v,i)=>{ if(v!=null){ curSum+=v; prevSum+=(lastYearArr[i]||0); cnt++; } });
  const yoyPct = prevSum>0 ? ((curSum-prevSum)/prevSum*100) : null;
  const lastYearFullTotal = lastYearArr.reduce((a,b)=>a+(b||0),0);
  const yoyColor = yoyPct==null ? '#111827' : (yoyPct>=0 ? '#059669' : '#dc2626');
  const yoyText = yoyPct==null ? '—' : `${yoyPct>=0?'+':''}${yoyPct.toFixed(1)}%`;

  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-label">${thisYear}年累計（至M${cnt}）</div><div class="stat-value">${fmt(curSum)} 元</div></div>
    <div class="stat-card"><div class="stat-label">${lastYear}年同期累計</div><div class="stat-value">${fmt(prevSum)} 元</div></div>
    <div class="stat-card"><div class="stat-label">同期成長率</div><div class="stat-value" style="color:${yoyColor};">${yoyText}</div></div>
    <div class="stat-card"><div class="stat-label">${lastYear}年全年總計</div><div class="stat-value">${fmt(lastYearFullTotal)} 元</div></div>
  `;
}

function render(){
  const type = chartTypeSel.value;
  monthWrap.style.display='none';
  platformWrap.style.display='none';
  trafficPlatformWrap.style.display='none';
  categoryWrap.style.display='none';
  ipPlatformWrap.style.display='none';
  ipWrap.style.display='none';
  if(type==='revenueRank'){ monthWrap.style.display=''; renderRanking('monthlyRevenue','營業額'); }
  else if(type==='orderRank'){ monthWrap.style.display=''; renderRanking('monthlyOrders','訂單數'); }
  else if(type==='aovRank'){ monthWrap.style.display=''; renderRanking('monthlyAOV','客單價'); }
  else if(type==='convRank'){ monthWrap.style.display=''; renderRanking('monthlyConversion','轉換率'); }
  else if(type==='bestSellers'){ monthWrap.style.display=''; renderBestSellers(); }
  else if(type==='slowMoving'){ renderSlowMoving(); }
  else if(type==='trafficTrend'){ trafficPlatformWrap.style.display=''; renderTrafficTrend(); }
  else if(type==='categoryAnalysis'){ monthWrap.style.display=''; platformWrap.style.display=''; categoryWrap.style.display=''; renderCategoryAnalysis(); }
  else if(type==='yoyCompare'){ platformWrap.style.display=''; renderYoyComparison(); }
  else if(type==='ipAnalysis'){ monthWrap.style.display=''; ipPlatformWrap.style.display=''; ipWrap.style.display=''; renderIPAnalysis(); }
  else { monthWrap.style.display=''; platformWrap.style.display=''; renderDaily(); }
}

chartTypeSel.addEventListener('change', render);
monthSel.addEventListener('change', render);
platformSel.addEventListener('change', render);
trafficPlatformSel.addEventListener('change', render);
categorySel.addEventListener('change', render);
ipPlatformSel.addEventListener('change', render);
ipSel.addEventListener('change', render);
render();

</script>
</body>
</html>
