<style>

    min-width: 180px;
    color: #1f2430;

  #chartTitle { font-size: 16px; font-weight: 700; margin: 20px 0 12px; }

  .chart-row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
  .chart-row .chart-col { flex: 1; min-width: 260px; }
  .chart-row .chart-col h3 { font-size: 13px; color: #6b7280; margin: 0 0 8px; font-weight: 600; }
  .chart-wrap-small { position: relative; height: 300px; }
  .stats-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  .stat-card {
    background: #f8f9fc;
    border: 1px solid #eef0f4;
    border-radius: 10px;
    padding: 12px 16px;
    flex: 1;
    min-width: 140px;
  }
  .stat-label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
  .stat-value { font-size: 17px; font-weight: 700; color: #1f2430; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th {
    text-align: left; font-size: 12px; color: #6b7280; font-weight: 600;
    padding: 8px 10px; border-bottom: 2px solid #eef0f4; white-space: nowrap;
  }
  .data-table td { padding: 9px 10px; border-bottom: 1px solid #f1f2f6; vertical-align: top; }
  .data-table tr:nth-child(even) td { background: #fafbfc; }
  .data-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .data-table .rank { color: #9ca3af; font-weight: 600; width: 32px; }
  .data-table .tag {
    display: inline-block; font-size: 11px; background: #eef2ff; color: #4f46e5;
    border-radius: 4px; padding: 1px 6px; margin: 1px 2px 1px 0;
  }
  .data-table .warn-tag { background: #fef2f2; color: #dc2626; }
  .table-wrap { overflow-x: auto; }
  .table-note { font-size: 12px; color: #9ca3af; margin-top: 10px; }
  footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 20px; }

<script>

  return (Math.round(n * 10) / 10).toLocaleString('zh-TW', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}

const dailyMap = {};

  if (!dailyMap[rec.date]) dailyMap[rec.date] = {};

const TRAFFIC_CHART_PLATFORMS = (DATA.trafficPlatforms || []).filter(p => p !== 'Moomin');

// metric 設定：單位、小數位、是否用平均而非加總（客單價/轉換率用平均）、適用平台清單
const METRIC_CONFIG = {
  monthlyRevenue:   { unit: '元', decimals: 0, agg: 'sum',  platforms: platforms },
  monthlyOrders:    { unit: '筆', decimals: 0, agg: 'sum',  platforms: platforms },
  monthlyAOV:       { unit: '元', decimals: 0, agg: 'avg',  platforms: platforms },
  monthlyConversion:{ unit: '%',  decimals: 2, agg: 'avg',  platforms: VISITOR_PLATFORMS },
  monthlyPageviews:{ unit: '次',  decimals: 0, agg: 'sum',  platforms: DATA.trafficPlatforms || [] },
  monthlyVisitors: { unit: '人',  decimals: 0, agg: 'sum',  platforms: VISITOR_PLATFORMS },
  monthlyRPV:      { unit: '元/千次瀏覽', decimals: 1, agg: 'avg', platforms: DATA.trafficPlatforms || [] },
};

function getRanking(metric, monthIdxOrAll) {
  const src = DATA[metric] || {};
  const cfg = METRIC_CONFIG[metric];
  const eligiblePlatforms = cfg.platforms;
  const rows = eligiblePlatforms.map(p => {
    const arr = (src[p] || []).map(v => (v === null || v === undefined ? null : v));
    let val;
    if (monthIdxOrAll === 'all') {
      const valid = arr.filter(v => v !== null);
      if (valid.length === 0) { val = 0; }
      else if (cfg.agg === 'avg') { val = valid.reduce((a, b) => a + b, 0) / valid.length; }
      else { val = valid.reduce((a, b) => a + b, 0); }
    } else {
      const v = arr[monthIdxOrAll];
      val = (v === null || v === undefined) ? 0 : v;
    }
    return { platform: p, value: val };
  });
  rows.sort((a, b) => b.value - a.value);
  return rows;
}

const BarValueLabels = {
  id: 'barValueLabels',
  afterDatasetsDraw(chart, args, opts) {
    if (!chart.config.options.__showBarValues) return;
    const fn = chart.config.options.__barValueFormat || ((v) => v);
    const { ctx } = chart;
    ctx.save();
    ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif';
    ctx.fillStyle = '#1f2430';
    ctx.textBaseline = 'middle';
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di);
      if (meta.hidden) return;
      meta.data.forEach((el, i) => {
        const v = ds.data[i];
        if (v === null || v === undefined) return;
        const text = fn(v);
        const horizontal = chart.config.options.indexAxis === 'y';
        if (horizontal) {
          ctx.textAlign = 'left';
          ctx.fillText(text, el.x + 8, el.y);
        } else {
          ctx.textAlign = 'center';
          ctx.fillText(text, el.x, el.y - 8);
        }
      });
    });
    ctx.restore();
  }
};
if (window.Chart) Chart.register(BarValueLabels);

function renderCategoryDoughnut(dateIdxs) {
  const platVal = platformSel.value;
  const platList = platVal === 'all' ? DATA.categoryPlatforms : [platVal];

  const totals = DATA.categories.map(cat => {
    let sum = 0;
    platList.forEach(p => {
      const arr = (DATA.categoryDailyRevenue[p] && DATA.categoryDailyRevenue[p][cat]) || [];
      dateIdxs.forEach(i => { sum += arr[i] || 0; });
    });
    return { category: cat, value: sum };
  }).filter(e => e.value > 0).sort((a, b) => b.value - a.value);

  const labels = totals.map(e => e.category);
  const values = totals.map(e => e.value);

      plugins: {
        legend: { position: 'right', labels: { boxWidth: 16, font: { size: 15 } } },
        tooltip: {
          callbacks: {
            label: (c) => {

function renderCategoryAnalysis() {
  if (!DATA.categories || !DATA.categoryDailyRevenue) {
    titleEl.textContent = '分類分析 — 尚無資料';
    if (chart) { chart.destroy(); chart = null; }
    if (chart2) { chart2.destroy(); chart2 = null; }
    categoryDoughnutRow.style.display = 'none';
    statsEl.innerHTML = `<div class="stat-card"><div class="stat-label">提醒</div><div class="stat-value" style="font-size:14px;">找不到 ERP 商品分類資料，請確認「ERP訂單匯出」資料夾內有匯出檔案，並重新執行 build_dashboard.py</div></div>`;
    return;
  }

  const catVal = categorySel.value;
  const platVal = platformSel.value;
  const allDates = DATA.dates;
  const monthVal = monthSel.value === 'all' ? 'all' : parseInt(monthSel.value, 10);
  const dateIdxs = monthVal === 'all'
    ? allDates.map((_, i) => i)
    : allDates.reduce((acc, d, i) => { if (d.startsWith(months[monthVal])) acc.push(i); return acc; }, []);
  const dates = dateIdxs.map(i => allDates[i]);

  const platList = platVal === 'all' ? DATA.categoryPlatforms : [platVal];

  const values = dateIdxs.map(i => {
    return platList.reduce((sum, p) => {
      const arr = (DATA.categoryDailyRevenue[p] && DATA.categoryDailyRevenue[p][catVal]) || [];
      return sum + (arr[i] || 0);
    }, 0);
  });

  const periodLabel = monthVal === 'all'
    ? `${allDates[0]} ~ ${allDates[allDates.length - 1]}`
    : monthLabels[monthVal];
  titleEl.textContent = `分類分析 — ${catVal} ・ ${platVal === 'all' ? '全部平台加總' : platVal}（${periodLabel}）`;

  categoryDoughnutRow.style.display = '';
  renderCategoryDoughnut(dateIdxs);

  const labels = dates.map(d => { const p = d.split('-'); return `${p[1]}/${p[2]}`; });
  const color = platVal === 'all' ? '#2563eb' : platColor[platVal];

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: catVal,
        data: values,
        borderColor: color,
        backgroundColor: 'rgba(37,99,235,0.1)',
        fill: true,
        tension: 0.25,
        pointRadius: 0,
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (c) => `${catVal}: ${fmt(c.raw)} 元` } }
      },
      scales: {
        x: { ticks: { maxTicksLimit: 14, autoSkip: true }, grid: { display: false } },
        y: { ticks: { callback: (v) => fmt(v) }, grid: { color: '#eef0f4' } }
      }
    }
  });

  // 客單價：該分類 x 平台的總營業額 / 不重複訂單數
  // 全部月份：用整體 categoryOrderCounts；選了特定月份：用該月的 categoryMonthlyOrders
  let totalRevenue = values.reduce((a, b) => a + b, 0);
  let totalOrders = 0;
  if (monthVal === 'all') {
    platList.forEach(p => {
      const ord = (DATA.categoryOrderCounts[p] && DATA.categoryOrderCounts[p][catVal]) || 0;
      totalOrders += ord;
    });
  } else {
    const ym = months[monthVal];
    platList.forEach(p => {
      const m = (DATA.categoryMonthlyOrders[p] && DATA.categoryMonthlyOrders[p][catVal]) || {};
      totalOrders += m[ym] || 0;
    });
  }
  const aov = totalOrders > 0 ? totalRevenue / totalOrders : 0;

  // 業績總和：全部月份時，特別標出「最新一個月」當參考；選了特定月份時，就是該月的總和
  let periodTotalLabel, periodTotalVal;
  if (monthVal === 'all') {
    const latestMonth = DATA.categoryLatestMonth;
    let monthTotal = 0;
    platList.forEach(p => {
      const m = (DATA.categoryMonthlyRevenue[p] && DATA.categoryMonthlyRevenue[p][catVal]) || {};
      monthTotal += m[latestMonth] || 0;
    });
    periodTotalLabel = `當月(${latestMonth})業績總和`;
    periodTotalVal = monthTotal;
  } else {
    periodTotalLabel = `當月(${months[monthVal]})業績總和`;
    periodTotalVal = totalRevenue;
  }

  // 單日最高業績
  const maxIdx = values.length ? values.indexOf(Math.max(...values)) : -1;
  const maxDate = maxIdx >= 0 ? dates[maxIdx] : '—';
  const maxVal = maxIdx >= 0 ? values[maxIdx] : 0;

  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-label">客單價</div><div class="stat-value">${fmt(aov)} 元</div><div style="font-size:11px;color:#9ca3af;margin-top:2px;">共 ${totalOrders} 張訂單</div></div>
    <div class="stat-card"><div class="stat-label">${periodTotalLabel}</div><div class="stat-value">${fmt(periodTotalVal)} 元</div></div>
    <div class="stat-card"><div class="stat-label">單日最高業績</div><div class="stat-value">${maxDate}</div><div style="font-size:13px;color:#1f2430;margin-top:2px;">${fmt(maxVal)} 元</div></div>
  `;
}

        tooltip: {
          callbacks: {
            label: (c) => `${c.dataset.label}：${c.raw == null ? '無資料' : fmt(c.raw) + ' 元'}`,
            afterBody: (items) => {
              const idx = items[0].dataIndex;
              const cur = thisYearArr[idx], prev = lastYearArr[idx];
              if (cur != null && prev != null && prev !== 0) {
                const pct = ((cur - prev) / prev * 100);
                return [`YoY：${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%`];
              }
              return [];
            }
          }
        }
      },
      scales: {
        x: { grid: { display: false } },
        y: { ticks: { callback: (v) => fmt(v) }, grid: { color: '#eef0f4' }, title: { display: true, text: '營業額（元）' } },
      }
    }
  });

  let curSum = 0, prevSum = 0, n = 0;
  thisYearArr.forEach((v, i) => {
    if (v != null) { curSum += v; prevSum += (lastYearArr[i] || 0); n++; }
  });
  const yoyPct = prevSum > 0 ? ((curSum - prevSum) / prevSum * 100) : null;
  const lastYearFullTotal = lastYearArr.reduce((a, b) => a + (b || 0), 0);
  const yoyColor = yoyPct == null ? '#111827' : (yoyPct >= 0 ? '#059669' : '#dc2626');
  const yoyText = yoyPct == null ? '—' : `${yoyPct >= 0 ? '+' : ''}${yoyPct.toFixed(1)}%`;

  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-label">${thisYear}年累計（至M${n}）</div><div class="stat-value">${fmt(curSum)} 元</div></div>
    <div class="stat-card"><div class="stat-label">${lastYear}年同期累計</div><div class="stat-value">${fmt(prevSum)} 元</div></div>
    <div class="stat-card"><div class="stat-label">同期成長率</div><div class="stat-value" style="color:${yoyColor};">${yoyText}</div></div>
    <div class="stat-card"><div class="stat-label">${lastYear}年全年總計</div><div class="stat-value">${fmt(lastYearFullTotal)} 元</div></div>
  `;
}

function renderBestSellers() {
  if (!DATA.bestSellers || !DATA.bestSellers.length) {
    titleEl.textContent = '熱銷商品 TOP20 — 尚無資料';
    tableArea.innerHTML = `<div class="stat-card"><div class="stat-label">提醒</div><div class="stat-value" style="font-size:14px;">找不到庫存或銷貨單資料，請確認「ERP訂單匯出」資料夾內同時有庫存匯出檔（按倉庫庫存情況）與銷貨單匯出檔，並重新執行 build_dashboard.py</div></div>`;
    statsEl.innerHTML = '';
    return;
  }

  const isAll = monthSel.value === 'all';
  const ym = isAll ? null : months[parseInt(monthSel.value, 10)];
  const periodLabel = isAll ? `${months[0]} ~ ${months[months.length - 1]}` : ym;
  const monthly = (!isAll && DATA.bestSellersMonthly) ? (DATA.bestSellersMonthly[ym] || []) : null;
  const items = isAll ? DATA.bestSellers : monthly;

  if (!isAll && (!items || !items.length)) {
    titleEl.textContent = `熱銷商品 TOP20（依金額排序）— ${periodLabel} 尚無資料`;
    tableArea.innerHTML = `<div class="table-note">這個月份沒有符合條件的銷售資料。</div>`;
    statsEl.innerHTML = '';
    return;
  }

  titleEl.textContent = `熱銷商品 TOP${items.length}（依金額排序）— ${periodLabel}`;

  const rows = items.map((item, i) => {
    const platTags = (item.platforms || []).map(p => `<span class="tag">${p}</span>`).join('');
    const qtyText = (item.estQty === null || item.estQty === undefined) ? '—' : fmt(item.estQty);
    return `
      <tr>
        <td class="rank">${i + 1}</td>
        <td>${item.name}</td>
        <td class="num">${fmt(item.revenue)} 元</td>
        <td class="num">${qtyText}</td>
        <td class="num">${item.orders}</td>
        <td>${platTags}</td>
      </tr>`;
  }).join('');

  const qtyIsReal = !!DATA.bestSellersQtyIsReal;
  const qtyHeader = qtyIsReal ? '銷量' : '銷量（估）';
  const qtyNote = qtyIsReal
    ? '銷量為ERP銷貨單明細的實際數量；「—」代表資料缺漏，無法統計。'
    : '銷量是用目前庫存單價反推的估計值，商品若曾調價會有誤差；「—」代表對應不到目前庫存單價，無法估算。';
  tableArea.innerHTML = `
    <table class="data-table">
      <thead>
        <tr><th>#</th><th>商品</th><th class="num">金額</th><th class="num">${qtyHeader}</th><th class="num">訂單數</th><th>銷售平台</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="table-note">${qtyNote}資料來源：${DATA.productSalesSource || 'ERP銷貨單'}</div>
  `;

  const totalRev = items.reduce((a, b) => a + b.revenue, 0);
  const top = items[0];
  const periodTotal = isAll
    ? DATA.productRevenueTotalAll
    : (DATA.productMonthlyRevenueTotal || {})[ym];
  const shareText = (periodTotal && periodTotal > 0)
    ? `${(totalRev / periodTotal * 100).toFixed(1)}%`
    : '—';
  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-label">TOP${items.length}總金額</div><div class="stat-value">${fmt(totalRev)} 元</div></div>
    <div class="stat-card"><div class="stat-label">冠軍商品</div><div class="stat-value" style="font-size:14px;">${top.name}</div></div>
    <div class="stat-card"><div class="stat-label">統計期間</div><div class="stat-value" style="font-size:14px;">${periodLabel}</div></div>
    <div class="stat-card"><div class="stat-label">TOP${items.length}佔當期營業額比例</div><div class="stat-value">${shareText}</div></div>
  `;
}

function renderSlowMoving() {
  if (!DATA.slowMoving) {
    titleEl.textContent = '滯銷庫存分析 — 尚無資料';
    tableArea.innerHTML = `<div class="stat-card"><div class="stat-label">提醒</div><div class="stat-value" style="font-size:14px;">這一塊需要庫存匯出檔（按倉庫庫存情況）才能算。請把它放進「ERP訂單匯出」資料夾再重新執行 build_dashboard.py。熱銷排行只看銷貨明細，不受影響。</div></div>`;
    statsEl.innerHTML = '';
    return;
  }

  const thresh = DATA.slowMovingThresholdDays;
  const invAsOf = DATA.inventoryAsOf;
  titleEl.textContent = invAsOf
    ? `滯銷庫存分析 — 有庫存但近${thresh}天沒賣出（庫存基準日 ${invAsOf}）`
    : `滯銷庫存分析 — 目前有庫存但近${thresh}天沒賣出`;

  if (DATA.slowMoving.length === 0) {
    tableArea.innerHTML = `<div class="table-note">目前沒有符合「有庫存但近${thresh}天未售出」的商品，庫存去化狀況良好。</div>`;
    statsEl.innerHTML = '';
    return;
  }

  const rows = DATA.slowMoving.map(item => {
    const lastSaleText = item.lastSaleDate
      ? `${item.lastSaleDate}（${item.daysSince} 天前）`
      : `<span class="tag warn-tag">ERP期間內無銷售紀錄</span>`;
    return `
      <tr>
        <td>${item.name}</td>
        <td>${item.category || '—'}</td>
        <td class="num">${fmt(item.stock)}</td>
        <td>${lastSaleText}</td>
      </tr>`;
  }).join('');

  tableArea.innerHTML = `
    <table class="data-table">
      <thead><tr><th>商品</th><th>分類</th><th class="num">目前庫存</th><th>最後銷售</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="table-note">符合「有庫存但近${thresh}天沒賣出」的商品共 ${DATA.slowMovingTotalCount} 項，這裡列出庫存量最高的前 ${DATA.slowMoving.length} 項，建議優先評估出清。庫存量與判定基準日皆為 ${invAsOf || '庫存匯出當日'} 的快照（檔案：${DATA.productInventorySource || 'ERP庫存匯出'}）。${DATA.inventoryStaleDays ? `<span class="tag warn-tag">庫存已落後銷貨資料 ${DATA.inventoryStaleDays} 天，清單會偏高，建議重新匯出庫存</span>` : ''}</div>
  `;

  const totalStock = DATA.slowMoving.reduce((a, b) => a + b.stock, 0);
  const neverSold = DATA.slowMoving.filter(x => !x.lastSaleDate).length;
  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-label">滯銷候選商品數</div><div class="stat-value">${DATA.slowMovingTotalCount} 項</div></div>
    <div class="stat-card"><div class="stat-label">本表庫存量合計</div><div class="stat-value">${fmt(totalStock)} 件</div></div>
    <div class="stat-card"><div class="stat-label">從未售出（ERP期間內）</div><div class="stat-value">${neverSold} 項</div></div>
  `;
}

function render() {
  const type = chartTypeSel.value;
  if (type !== 'categoryAnalysis') {
    categoryDoughnutRow.style.display = 'none';
    if (chart2) { chart2.destroy(); chart2 = null; }
  }
  trafficPlatformWrap.style.display = 'none';

  if (type === 'bestSellers' || type === 'slowMoving') {
    mainChartWrap.style.display = 'none';
    tableArea.style.display = '';
    if (chart) { chart.destroy(); chart = null; }
  } else {
    mainChartWrap.style.display = '';
    tableArea.style.display = 'none';
  }

  if (type === 'revenueRank') {
    monthWrap.style.display = '';
    platformWrap.style.display = 'none';
    categoryWrap.style.display = 'none';
    renderRanking('monthlyRevenue', '營業額');
  } else if (type === 'orderRank') {
    monthWrap.style.display = '';
    platformWrap.style.display = 'none';
    categoryWrap.style.display = 'none';
    renderRanking('monthlyOrders', '訂單數');
  } else if (type === 'convRank') {
    monthWrap.style.display = '';
    platformWrap.style.display = 'none';
    categoryWrap.style.display = 'none';
    renderRanking('monthlyConversion', '轉換率');
  } else if (type === 'pageviewRank') {
    monthWrap.style.display = '';
    platformWrap.style.display = 'none';
    categoryWrap.style.display = 'none';
    renderRanking('monthlyPageviews', '瀏覽量');
  } else if (type === 'visitorRank') {
    monthWrap.style.display = '';
    platformWrap.style.display = 'none';
    categoryWrap.style.display = 'none';
    renderRanking('monthlyVisitors', '訪客數');
  } else if (type === 'rpvRank') {
    monthWrap.style.display = '';
    platformWrap.style.display = 'none';
    categoryWrap.style.display = 'none';
    renderRanking('monthlyRPV', '千次瀏覽業績');
  } else if (type === 'yoyCompare') {
    monthWrap.style.display = 'none';
    platformWrap.style.display = '';
    categoryWrap.style.display = 'none';
    mainChartWrap.style.display = '';
    tableArea.style.display = 'none';
    renderYoyComparison();
  } else if (type === 'trafficTrend') {
    monthWrap.style.display = 'none';
    platformWrap.style.display = 'none';
    categoryWrap.style.display = 'none';
    trafficPlatformWrap.style.display = '';
    renderTrafficTrend();
  } else if (type === 'brandMix') {
    monthWrap.style.display = 'none';
    platformWrap.style.display = '';
    categoryWrap.style.display = 'none';
    renderBrandMix();
  } else if (type === 'categoryAnalysis') {
    monthWrap.style.display = '';
    platformWrap.style.display = '';
    categoryWrap.style.display = '';
    renderCategoryAnalysis();
  } else if (type === 'bestSellers') {
    monthWrap.style.display = '';
    platformWrap.style.display = 'none';
    categoryWrap.style.display = 'none';
    renderBestSellers();
  } else if (type === 'slowMoving') {
    monthWrap.style.display = 'none';
    platformWrap.style.display = 'none';
    categoryWrap.style.display = 'none';
    renderSlowMoving();
  } else {
    monthWrap.style.display = '';
    platformWrap.style.display = '';
    categoryWrap.style.display = 'none';
    renderDaily();
  }
}

chartTypeSel.addEventListener('change', render);
monthSel.addEventListener('change', render);
platformSel.addEventListener('change', render);
categorySel.addEventListener('change', render);
trafficPlatformSel.addEventListener('change', render);

render();

</script>
</body>
</html>
